        .cat-ears-container {
            position: relative;
        }
        .cat-ears-container::before, .cat-ears-container::after {
            content: '';
            position: absolute;
            top: -12px;
            width: 30px;
            height: 30px;

        .cat-ears-container:hover::before {

    <script>
        /* -------------------------------------------------------------
           1. DATA STORE
        ------------------------------------------------------------- */
        const catBreeds = [
            { id: 1, name: "英短藍貓 (大臉嘟嘟)", breed: "英國短毛貓", price: 28000, rating: 5.0, tag: "熱銷爆款", personality: "溫和好脾氣、包子臉大眼睛", image: "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=800&q=80" },
            { id: 2, name: "仙女布偶貓 (泡芙)", breed: "布偶貓", price: 45000, rating: 4.9, tag: "溫和黏人", personality: "藍眼睛仙氣爆棚、極度親人", image: "https://images.unsplash.com/photo-1533738363-b7f9aef128ce?auto=format&fit=crop&w=800&q=80" },
            { id: 3, name: "美短加白 (虎斑小將)", breed: "美國短毛貓", price: 22000, rating: 4.8, tag: "短毛好照顧", personality: "體質強健、活潑好動", image: "https://images.unsplash.com/photo-1573865526739-10659fec78a5?auto=format&fit=crop&w=800&q=80" },
            { id: 4, name: "霸氣緬因貓 (獅子王)", breed: "緬因貓", price: 52000, rating: 5.0, tag: "蓬鬆巨無霸", personality: "溫柔的巨人、耳尖有纓毛", image: "https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?auto=format&fit=crop&w=800&q=80" },
            { id: 5, name: "曼赤肯短腿貓 (小短腿)", breed: "曼赤肯短腿貓", price: 38000, rating: 4.9, tag: "短腿萌神", personality: "跑起來像小跑車、好奇心強", image: "https://images.unsplash.com/photo-1513360371669-4adf3dd7dff8?auto=format&fit=crop&w=800&q=80" },
            { id: 6, name: "暹羅王子 (可可豆)", breed: "暹羅貓", price: 18000, rating: 4.7, tag: "愛說話黏人", personality: "貓界小狗、極度愛跟主人聊天", image: "https://images.unsplash.com/photo-1513245543132-31f507417b26?auto=format&fit=crop&w=800&q=80" }
        ];

        let cart = [];
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let happiness = 100;
        let audioCtx = null;

        /* -------------------------------------------------------------
           2. WEB AUDIO SYNTHESIZER (SYNTHESIZE MEOW SOUNDS)
        ------------------------------------------------------------- */
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function triggerMeowSound(pitch = 450, duration = 0.35) {
            try {
                initAudio();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                
                // Meow pitch curve (starts higher, drops slightly)
                const now = audioCtx.currentTime;
                osc.frequency.setValueAtTime(pitch, now);
                osc.frequency.exponentialRampToValueAtTime(pitch * 1.3, now + duration * 0.3);
                osc.frequency.exponentialRampToValueAtTime(pitch * 0.7, now + duration);

                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.3, now + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + duration);
            } catch (e) {
                console.log("Audio pitch play preview constraint");
            }
        }

        /* -------------------------------------------------------------
           3. INTERACTIVE FULLSCREEN CAT CANVAS DRAWING ENGINE
        ------------------------------------------------------------- */
        let catCanvas, catCtx;
        let catBlinkState = false;

        function initCatCanvas() {
            catCanvas = document.getElementById('interactiveCatCanvas');
            if (!catCanvas) return;
            catCtx = catCanvas.getContext('2d');

            // Blink interval
            setInterval(() => {
                catBlinkState = true;
                setTimeout(() => { catBlinkState = false; }, 150);
            }, 3500);

            requestAnimationFrame(renderCatCanvas);
        }

        function renderCatCanvas() {
            if (!catCtx) return;
            const w = catCanvas.width;
            const h = catCanvas.height;
            catCtx.clearRect(0, 0, w, h);

            const centerX = w / 2;
            const centerY = h / 2 + 20;

            // 1. Draw Tail (Animated Wave)
            const time = Date.now() * 0.003;
            const tailAngle = Math.sin(time) * 20;
            catCtx.save();
            catCtx.translate(centerX + 140, centerY + 80);
            catCtx.rotate((tailAngle * Math.PI) / 180);
            catCtx.beginPath();
            catCtx.moveTo(0, 0);
            catCtx.quadraticCurveTo(60, -80, 40, -140);
            catCtx.lineWidth = 28;
            catCtx.strokeStyle = '#FF85B3';
            catCtx.lineCap = 'round';
            catCtx.stroke();
            catCtx.restore();

            // 2. Outer Cat Ears
            // Left Ear
            catCtx.beginPath();
            catCtx.moveTo(centerX - 130, centerY - 80);
            catCtx.lineTo(centerX - 180, centerY - 210);
            catCtx.lineTo(centerX - 50, centerY - 150);
            catCtx.fillStyle = '#FF85B3';
            catCtx.fill();

            // Left Inner Ear Pink
            catCtx.beginPath();
            catCtx.moveTo(centerX - 125, centerY - 90);
            catCtx.lineTo(centerX - 165, centerY - 190);
            catCtx.lineTo(centerX - 65, centerY - 145);
            catCtx.fillStyle = '#FFD6E8';
            catCtx.fill();

            // Right Ear
            catCtx.beginPath();
            catCtx.moveTo(centerX + 130, centerY - 80);
            catCtx.lineTo(centerX + 180, centerY - 210);
            catCtx.lineTo(centerX + 50, centerY - 150);
            catCtx.fillStyle = '#FF85B3';
            catCtx.fill();

            // Right Inner Ear Pink
            catCtx.beginPath();
            catCtx.moveTo(centerX + 125, centerY - 90);
            catCtx.lineTo(centerX + 165, centerY - 190);
            catCtx.lineTo(centerX + 65, centerY - 145);
            catCtx.fillStyle = '#FFD6E8';
            catCtx.fill();

            // 3. Cat Head Main Base (Soft Cream Pink Round)
            catCtx.beginPath();
            catCtx.ellipse(centerX, centerY, 170, 140, 0, 0, Math.PI * 2);
            catCtx.fillStyle = '#FFFFFF';
            catCtx.fill();
            catCtx.lineWidth = 8;
            catCtx.strokeStyle = '#FFD6E8';
            catCtx.stroke();

            // 4. Blush Cheeks
            catCtx.beginPath();
            catCtx.ellipse(centerX - 100, centerY + 30, 25, 15, 0, 0, Math.PI * 2);
            catCtx.ellipse(centerX + 100, centerY + 30, 25, 15, 0, 0, Math.PI * 2);
            catCtx.fillStyle = 'rgba(255, 133, 179, 0.4)';
            catCtx.fill();

            // 5. Interactive Eyes (Pupil Follow Mouse)
            const leftEyeX = centerX - 65;
            const rightEyeX = centerX + 65;
            const eyeY = centerY - 20;

            if (catBlinkState) {
                // Blink lines
                catCtx.beginPath();
                catCtx.arc(leftEyeX, eyeY, 25, 0.1 * Math.PI, 0.9 * Math.PI);
                catCtx.arc(rightEyeX, eyeY, 25, 0.1 * Math.PI, 0.9 * Math.PI);
                catCtx.lineWidth = 6;
                catCtx.strokeStyle = '#4A3E3D';
                catCtx.stroke();
            } else {
                // Eye Sclera Outer White
                catCtx.beginPath();
                catCtx.arc(leftEyeX, eyeY, 32, 0, Math.PI * 2);
                catCtx.arc(rightEyeX, eyeY, 32, 0, Math.PI * 2);
                catCtx.fillStyle = '#4A3E3D';
                catCtx.fill();

                // Calculate Pupil offset pointing to cursor
                const rect = catCanvas.getBoundingClientRect();
                const canvasMouseX = mouseX - rect.left;
                const canvasMouseY = mouseY - rect.top;

                const dxL = canvasMouseX - leftEyeX;
                const dyL = canvasMouseY - eyeY;
                const distL = Math.min(Math.hypot(dxL, dyL), 12);
                const angleL = Math.atan2(dyL, dxL);

                const dxR = canvasMouseX - rightEyeX;
                const dyR = canvasMouseY - eyeY;
                const distR = Math.min(Math.hypot(dxR, dyR), 12);
                const angleR = Math.atan2(dyR, dxR);

                const pupilLX = leftEyeX + Math.cos(angleL) * distL;
                const pupilLY = eyeY + Math.sin(angleL) * distL;

                const pupilRX = rightEyeX + Math.cos(angleR) * distR;
                const pupilRY = eyeY + Math.sin(angleR) * distR;

                // Shiny Pupil Sparkles
                catCtx.beginPath();
                catCtx.arc(pupilLX - 6, pupilLY - 6, 12, 0, Math.PI * 2);
                catCtx.arc(pupilRX - 6, pupilRY - 6, 12, 0, Math.PI * 2);
                catCtx.fillStyle = '#FFFFFF';
                catCtx.fill();
            }

            // 6. Cute Nose
            catCtx.beginPath();
            catCtx.moveTo(centerX - 12, centerY + 20);
            catCtx.lineTo(centerX + 12, centerY + 20);
            catCtx.lineTo(centerX, centerY + 30);
            catCtx.closePath();
            catCtx.fillStyle = '#FF5388';
            catCtx.fill();

            // 7. Cat Mouth (W shape)
            catCtx.beginPath();
            catCtx.arc(centerX - 12, centerY + 34, 12, 0, Math.PI * 0.85);
            catCtx.arc(centerX + 12, centerY + 34, 12, 0.15 * Math.PI, Math.PI);
            catCtx.lineWidth = 5;
            catCtx.strokeStyle = '#4A3E3D';
            catCtx.stroke();

            // 8. Whiskers
            catCtx.lineWidth = 3;
            catCtx.strokeStyle = '#FFD6E8';
            // Left Whiskers
            catCtx.beginPath();
            catCtx.moveTo(centerX - 110, centerY + 10); catCtx.lineTo(centerX - 190, centerY - 5);
            catCtx.moveTo(centerX - 110, centerY + 25); catCtx.lineTo(centerX - 195, centerY + 25);
            catCtx.stroke();
            // Right Whiskers
            catCtx.beginPath();
            catCtx.moveTo(centerX + 110, centerY + 10); catCtx.lineTo(centerX + 190, centerY - 5);
            catCtx.moveTo(centerX + 110, centerY + 25); catCtx.lineTo(centerX + 195, centerY + 25);
            catCtx.stroke();

            // 9. Floating Paws at the bottom of the canvas
            catCtx.beginPath();
            catCtx.arc(centerX - 80, centerY + 135, 30, 0, Math.PI * 2);
            catCtx.arc(centerX + 80, centerY + 135, 30, 0, Math.PI * 2);
            catCtx.fillStyle = '#FFFFFF';
            catCtx.fill();
            catCtx.lineWidth = 4;
            catCtx.strokeStyle = '#FFD6E8';
            catCtx.stroke();

            // Pink Paw Beans
            catCtx.beginPath();
            catCtx.arc(centerX - 80, centerY + 135, 12, 0, Math.PI * 2);
            catCtx.arc(centerX + 80, centerY + 135, 12, 0, Math.PI * 2);
            catCtx.fillStyle = '#FF85B3';
            catCtx.fill();

            requestAnimationFrame(renderCatCanvas);
        }

        /* -------------------------------------------------------------
           4. FULLSCREEN CAT MODAL CONTROLLER & INTERACTIONS
        ------------------------------------------------------------- */
        function triggerFullscreenCat(title = '喵～ 巨萌貓咪出現啦！', breedName = '') {
            const modal = document.getElementById('fullScreenCatModal');
            if (!modal) return;

            document.getElementById('catModalTitle').textContent = breedName ? `喵！已將 ${breedName} 加入購物車！` : title;
            modal.classList.remove('hidden');

            // Play celebratory sound
            triggerMeowSound(520, 0.45);

            // Trigger Confetti Blast
            confetti({
                particleCount: 100,
                spread: 100,
                origin: { y: 0.5 },
                colors: ['#FF85B3', '#FFD6E8', '#FFE8A3', '#FF5388', '#E8D5FF']
            });

            // Add item to shopping cart automatically if called from product
            if (breedName) {
                const cat = catBreeds.find(c => c.name === breedName);
                if (cat) {
                    const existing = cart.find(i => i.id === cat.id);
                    if (existing) existing.qty += 1;
                    else cart.push({ ...cat, qty: 1 });
                    updateCartUI();
                }
            }
        }

        function closeFullscreenCat() {
            document.getElementById('fullScreenCatModal').classList.add('hidden');
        }

        function petCat(e) {
            triggerMeowSound(580, 0.3);
            triggerPawParticleBurst(e.clientX, e.clientY);
            happiness = Math.min(100, happiness + 5);
            document.getElementById('happinessScore').textContent = `${happiness}%`;
            showToast("摸摸貓頭～ 貓咪舒服得發出咕嚕聲 💕");
        }

        function feedCatCan(e) {
            triggerMeowSound(620, 0.4);
            triggerPawParticleBurst(e.clientX, e.clientY);
            confetti({ particleCount: 30, spread: 50, origin: { x: e.clientX / window.innerWidth, y: e.clientY / window.innerHeight } });
            showToast("餵食罐頭 🥫 貓咪開心得大口吃光光！");
        }

        function playToyStick(e) {
            triggerMeowSound(480, 0.35);
            triggerPawParticleBurst(e.clientX, e.clientY);
            showToast("搖動逗貓棒 🪄 貓咪眼睛發亮跳躍！");
        }

        /* -------------------------------------------------------------
           5. MOUSE TRAIL & PARTICLE BURST LOGIC
        ------------------------------------------------------------- */
        function triggerPawParticleBurst(x, y) {
            const emojis = ['🐾', '💕', '✨', '🌸', '💖', '🐟'];
            for (let i = 0; i < 12; i++) {
                const elem = document.createElement('div');
                elem.className = 'particle-emoji';
                elem.innerText = emojis[Math.floor(Math.random() * emojis.length)];

                const angle = (Math.PI * 2 / 12) * i + (Math.random() * 0.4 - 0.2);
                const distance = 70 + Math.random() * 70;
                elem.style.left = `${x}px`;
                elem.style.top = `${y}px`;
                elem.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
                elem.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
                elem.style.setProperty('--rot', `${Math.random() * 360 - 180}deg`);

                document.body.appendChild(elem);
                setTimeout(() => elem.remove(), 850);
            }
        }

        function initCursorTrail() {
            const canvas = document.getElementById('cursorCanvas');
            const ctx = canvas.getContext('2d');
            let points = [];

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            window.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;

                if (Math.random() > 0.35) {
                    points.push({ x: e.clientX, y: e.clientY, alpha: 1, size: Math.random() * 8 + 12 });
                }
            });

            function renderTrail() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < points.length; i++) {
                    const p = points[i];
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.font = `${p.size}px sans-serif`;
                    ctx.fillText('🐾', p.x, p.y);
                    ctx.restore();
                    p.alpha -= 0.025;
                }
                points = points.filter(p => p.alpha > 0);
                requestAnimationFrame(renderTrail);
            }
            renderTrail();
        }

        /* -------------------------------------------------------------
           6. RENDER SHOP UI & CARTS
        ------------------------------------------------------------- */
        function renderCatGrid() {
            const grid = document.getElementById('catGrid');
            grid.innerHTML = catBreeds.map(cat => `
                <div class="cat-ears-container group bg-white rounded-4xl p-4 border-2 border-pink-200 shadow-lg hover:shadow-2xl transition-all duration-300 flex flex-col justify-between relative hover:-translate-y-2">
                    <div class="relative rounded-3xl overflow-hidden h-56 bg-pink-50 mb-4">
                        <img src="${cat.image}" alt="${cat.name}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                        <span class="absolute top-3 left-3 bg-white/90 backdrop-blur-md border border-pink-300 text-meow-deepPink font-black text-[11px] px-3 py-1 rounded-full shadow-sm">
                            🌸 ${cat.tag}
                        </span>
                    </div>

                    <div class="space-y-2 flex-1 flex flex-col justify-between">
                        <div>
                            <div class="flex items-center justify-between">
                                <span class="text-[11px] font-bold text-meow-textLight bg-pink-100 px-2.5 py-0.5 rounded-full">${cat.breed}</span>
                                <div class="flex items-center text-amber-400 text-xs font-black">
                                    <i class="fa-solid fa-star mr-1"></i> ${cat.rating}
                                </div>
                            </div>
                            <h3 class="text-base font-black text-meow-text font-cute mt-1">${cat.name}</h3>
                            <p class="text-xs text-meow-textLight line-clamp-2 mt-1">${cat.personality}</p>
                        </div>

                        <div class="pt-3 border-t border-pink-100 flex items-center justify-between">
                            <div>
                                <span class="text-[10px] text-meow-textLight block">預約領養價</span>
                                <span class="text-lg font-black text-meow-deepPink font-cute">NT$ ${cat.price.toLocaleString()}</span>
                            </div>

                            <!-- Cart Trigger Button (Mandatory text: 加入購物車) -->
                            <button onclick="triggerFullscreenCat('🐾 已加入購物車！', '${cat.name}')" class="btn-add-cart text-white font-black text-xs px-4 py-2.5 rounded-full flex items-center space-x-1.5 shadow-md">
                                <i class="fa-solid fa-paw text-sm"></i>
                                <span>加入購物車</span>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateCartUI() {
            const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            document.getElementById('cartCountBadge').textContent = totalCount;
            document.getElementById('cartTotalPrice').textContent = `NT$ ${totalPrice.toLocaleString()}`;

            const list = document.getElementById('cartItemList');
            if (cart.length === 0) {
                list.innerHTML = `
                    <div class="text-center py-16 text-meow-textLight space-y-3">
                        <div class="text-5xl">🐾</div>
                        <p class="font-bold font-cute">購物籃空空如也喵～</p>
                    </div>
                `;
            } else {
                list.innerHTML = cart.map(item => `
                    <div class="flex items-center space-x-3 bg-pink-50/60 p-3 rounded-3xl border border-pink-200">
                        <img src="${item.image}" class="w-16 h-16 rounded-2xl object-cover border border-pink-300">
                        <div class="flex-1">
                            <h4 class="font-black text-xs text-meow-text font-cute">${item.name}</h4>
                            <p class="text-xs text-meow-deepPink font-bold mt-0.5">NT$ ${item.price.toLocaleString()}</p>
                        </div>
                        <span class="text-xs font-bold font-mono px-2">x${item.qty}</span>
                    </div>
                `).join('');
            }
        }

        function showToast(message) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'cute-glass text-xs font-bold text-meow-text px-5 py-3 rounded-full border-2 border-pink-300 shadow-xl flex items-center space-x-2 transition-all transform translate-y-4 opacity-0';
            toast.innerHTML = `<span>🐾</span><span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => toast.classList.remove('translate-y-4', 'opacity-0'), 50);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4');
                setTimeout(() => toast.remove(), 300);
            }, 2800);
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderCatGrid();
            initCursorTrail();
            initCatCanvas();

            // Cart drawer buttons
            const cartDrawer = document.getElementById('cartDrawer');
            document.getElementById('openCartBtn').addEventListener('click', () => cartDrawer.classList.remove('translate-x-full'));
            document.getElementById('closeCartBtn').addEventListener('click', () => cartDrawer.classList.add('translate-x-full'));
            document.getElementById('checkoutBtn').addEventListener('click', () => {
                triggerFullscreenCat('🎉 預約成功！全螢幕喵喵慶祝中！');
                cart = [];
                updateCartUI();
                cartDrawer.classList.add('translate-x-full');
            });
        });
    </script>
</body>
